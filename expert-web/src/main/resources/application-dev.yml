spring:
  application:
    name: databuff-digital-expert
  datasource:
    url: ${DB_URL:jdbc:mysql://192.168.50.120:13306/expert_databuff?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:234*(sdlj12}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB
  mvc:
    format:
      date: yyyy-MM-dd
      time: HH:mm:ss
      date-time: yyyy-MM-dd HH:mm:ss

server:
  port: 19008

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

digital-expert:
  cors:
    enabled: true
    path-pattern: /api/**
    allowed-origin-patterns:
      - "*"
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    exposed-headers:
      - Content-Disposition
    allow-credentials: false
    max-age-seconds: 3600
  training:
    output-root: E:\ai-work\app\agent/output/
    spec-skill-path: E:\ai-work\databuff-digital-expert\expert-web\src\main\resources\skills\root-skills-creator\
    poll-interval-ms: 5000
    session-timeout-ms: 1800000
    artifact-grace-period-ms: 120000
    release-timeout-ms: 1800000
  proxy:
    timeout-ms: 15000
    base-url: http://127.0.0.1:19300
  static-package: E:\ai-work\app\upload\static

opencode:
  base-url: http://127.0.0.1:4096
  connect-timeout: 5000
  read-timeout: 15000
