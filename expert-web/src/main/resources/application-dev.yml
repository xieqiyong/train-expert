spring:
  application:
    name: databuff-digital-expert
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:13306/expert_databuff?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Root_ChangeMe_2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  mvc:
    format:
      date: yyyy-MM-dd
      time: HH:mm:ss
      date-time: yyyy-MM-dd HH:mm:ss

server:
  port: 19008

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

digital-expert:
  cors:
    enabled: true
    path-pattern: /api/**
    allowed-origin-patterns:
      - "*"
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    exposed-headers:
      - Content-Disposition
    allow-credentials: false
    max-age-seconds: 3600
  training:
    output-root: /app/agent/output/
    spec-skill-path: /app/skills/root-skills-creator/
    poll-interval-ms: 5000
    session-timeout-ms: 1800000
    artifact-grace-period-ms: 120000
    release-timeout-ms: 1800000
  static-package: /app/upload/static
  agent:
    skills-output:
      - /root/.opencode/skills/

opencode:
  enabled: true
  host: 127.0.0.1
  port: 4096
  connect-timeout: 5s
  read-timeout: 5m
  directory:
  workspace:
