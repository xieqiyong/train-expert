spring:
  application:
    name: databuff-digital-expert
  datasource:
    url: ${DB_URL:jdbc:mysql://192.168.50.195:3306/expert_databuff?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:234*(sdlj12}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  mvc:
    format:
      date: yyyy-MM-dd
      time: HH:mm:ss
      date-time: yyyy-MM-dd HH:mm:ss
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    consumer:
      auto-offset-reset: latest
      enable-auto-commit: true
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      missing-topics-fatal: false

server:
  port: ${SERVER_PORT:19008}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

digital-expert:
  training:
    output-root: /var/dacheng/agent/output/
    spec-skill-path: /expert-web/root-skills-creator/
    poll-interval-ms: 5000
    session-timeout-ms: 1800000
    artifact-grace-period-ms: 120000
    release-timeout-ms: 1800000
    kafka:
      enabled: ${DIGITAL_EXPERT_TRAINING_KAFKA_ENABLED:false}
      topic: ${DIGITAL_EXPERT_TRAINING_KAFKA_TOPIC:dc_expert_file}
      group-id: ${DIGITAL_EXPERT_TRAINING_KAFKA_GROUP_ID:digital-expert-training}
      app-info-dir-name: ${DIGITAL_EXPERT_TRAINING_KAFKA_APP_INFO_DIR_NAME:app_info}
  proxy:
    timeout-ms: 15000
    base-url: http://192.168.50.18:19300
  static-package: /var/dacheng/upload/static
