spring:
  application:
    name: databuff-digital-expert
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:192.168.50.195:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:databuff-digital-expert}
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      missing-topics-fatal: false
  datasource:
    url: ${DB_URL:jdbc:mysql://192.168.50.195:3306/dc_databuff?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:234*(sdlj12}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:schema.sql
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB
  mvc:
    format:
      date: yyyy-MM-dd
      time: HH:mm:ss
      date-time: yyyy-MM-dd HH:mm:ss

server:
  port: 19008

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

digital-expert:
  training:
    output-root: /app/agent/output/
    spec-skill-path: /app/skills/root-skills-creator/
    poll-interval-ms: 5000
    session-timeout: 720m
    artifact-grace-period: 300m
    release-timeout: 30m
  redis:
    host: ${REDIS_HOST:192.168.50.195}
    port: ${REDIS_PORT:16379}
    password: ${REDIS_PASSWORD:Databuff@123+}
    database: ${REDIS_DATABASE:1}
    connect-timeout: 5s
    timeout: 3s
  proxy:
    timeout-ms: 15000
    base-url: http://127.0.0.1:19300
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    topics:
      dc-databuff-k8s: dc_databuff_k8s
  static-package: /app/upload/static

opencode:
  base-url: http://127.0.0.1:4096
  connect-timeout: 5000
  read-timeout: 15000
