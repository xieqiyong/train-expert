spring:
  application:
    name: databuff-digital-expert
  datasource:
    url: ${DB_URL:jdbc:mysql://192.168.50.195:3306/expert_databuff?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:234*(sdlj12}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  mvc:
    format:
      date: yyyy-MM-dd
      time: HH:mm:ss
      date-time: yyyy-MM-dd HH:mm:ss

server:
  port: 19008

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

digital-expert:
  training:
    output-root: /var/dacheng/agent/output/
    spec-skill-path: /var/dacheng/agent/skills/root-skills-creator/
    poll-interval-ms: 5000
    session-timeout-ms: 1800000
    artifact-grace-period-ms: 120000
    release-timeout-ms: 1800000
  proxy:
    timeout-ms: 15000
    base-url: http://127.0.0.1:19300
  static-package: /var/dacheng/upload/static
  agent:
    skills-output:
      - /opt/databuff-ai-agent/agent-business/skills/
