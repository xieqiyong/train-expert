<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0;url=debug.html">
    <title>跳转到数字员工调试台</title>
    <script>
        window.location.replace("debug.html");
    </script>
    <style>
        :root {
            --bg: #f5f0e8;
            --panel: #fffdf8;
            --ink: #18222f;
            --muted: #6b7280;
            --accent: #006d77;
            --accent-2: #e29578;
            --border: #d9d1c5;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", "PingFang SC", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at top left, rgba(226, 149, 120, 0.18), transparent 24rem),
                linear-gradient(180deg, #fffaf3 0%, var(--bg) 100%);
        }

        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 20px 64px;
        }

        .hero {
            padding: 28px;
            border: 1px solid rgba(24, 34, 47, 0.08);
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(0, 109, 119, 0.96), rgba(24, 34, 47, 0.92));
            color: #f8fafc;
            box-shadow: 0 24px 60px rgba(24, 34, 47, 0.18);
        }

        .hero h1 {
            margin: 0 0 12px;
            font-size: clamp(28px, 5vw, 46px);
            line-height: 1;
        }

        .hero p {
            margin: 0;
            max-width: 720px;
            color: rgba(248, 250, 252, 0.82);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 18px;
            margin-top: 24px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 12px 32px rgba(24, 34, 47, 0.06);
        }

        .card h2 {
            margin: 0 0 14px;
            font-size: 20px;
        }

        .hint {
            margin: -6px 0 16px;
            font-size: 13px;
            color: var(--muted);
        }

        label {
            display: block;
            margin-top: 12px;
            font-size: 13px;
            color: var(--muted);
        }

        input, textarea {
            width: 100%;
            margin-top: 6px;
            padding: 11px 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--ink);
        }

        textarea {
            min-height: 92px;
            resize: vertical;
        }

        button {
            margin-top: 14px;
            border: 0;
            border-radius: 999px;
            padding: 11px 18px;
            background: linear-gradient(135deg, var(--accent), #0f4c5c);
            color: #fff;
            cursor: pointer;
            font-weight: 600;
        }

        button.secondary {
            background: linear-gradient(135deg, var(--accent-2), #d97757);
        }

        .log {
            margin-top: 24px;
            padding: 18px;
            border-radius: 18px;
            background: #141f28;
            color: #d9f7ff;
            min-height: 220px;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: Consolas, Monaco, monospace;
            font-size: 13px;
        }

        .row {
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        @media (max-width: 720px) {
            .row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="page">
    <section class="hero">
        <h1>Digital Expert Test Console</h1>
        <p>用于本地接口联调的静态测试页。按顺序完成技能包上传、静态包上传、专家创建、绑定、发布、查询和下载。</p>
    </section>

    <div class="grid">
        <section class="card">
            <h2>1. 上传技能包</h2>
            <div class="hint">技能 ZIP 内必须包含 `SKILL.md`，且带有 `name:` 和 `description:`。</div>
            <form id="skill-form">
                <label>skillId<input name="skillId" value="generate_quote" required></label>
                <label>技能 ZIP<input type="file" name="file" accept=".zip" required></label>
                <button type="submit">上传技能包</button>
            </form>
        </section>

        <section class="card">
            <h2>2. 上传 static package</h2>
            <form id="static-form">
                <label>staticType<input name="staticType" value="DOCUMENT" required></label>
                <label>名称<input name="name" value="销售模板包" required></label>
                <label>描述<input name="description" value="联调用模板" ></label>
                <label>资源文件<input type="file" name="file" required></label>
                <button type="submit">上传 static package</button>
            </form>
        </section>

        <section class="card">
            <h2>3. 创建专家</h2>
            <form id="expert-form">
                <label>expertId<input name="expertId" value="sales_expert" required></label>
                <label>名称<input name="name" value="销售数字专家" required></label>
                <label>描述<textarea name="description">负责销售咨询、模板装载和报价输出。</textarea></label>
                <button type="submit">创建专家</button>
            </form>
        </section>

        <section class="card">
            <h2>4. 绑定配置</h2>
            <div class="hint">列表用英文逗号分隔。MCP 白名单按行填写。</div>
            <form id="binding-form">
                <label>expertId<input name="expertId" value="sales_expert" required></label>
                <label>skills<input name="skills" value="generate_quote"></label>
                <label>static packages<input name="staticPackages" value="sales_templates"></label>
                <label>MCP 名称<input name="bindingName" value="pricing_mcp"></label>
                <label>MCP URL<input name="mcpUrl" value="http://127.0.0.1:8081/mcp"></label>
                <label>tool whitelist<textarea name="toolWhitelist">get_price
create_quote</textarea></label>
                <button type="submit">更新绑定</button>
            </form>
        </section>

        <section class="card">
            <h2>5. 发布与轮询</h2>
            <form id="release-form">
                <label>expertId<input name="expertId" value="sales_expert" required></label>
                <div class="row">
                    <button type="submit">创建发布任务</button>
                    <button type="button" class="secondary" id="poll-task">轮询最近任务</button>
                </div>
            </form>
        </section>

        <section class="card">
            <h2>6. 查询与下载</h2>
            <form id="query-form">
                <label>expertId<input name="expertId" value="sales_expert" required></label>
                <div class="row">
                    <button type="submit">查询配置</button>
                    <button type="button" class="secondary" id="download-package">下载 ZIP</button>
                </div>
            </form>
        </section>
    </div>

    <pre class="log" id="log">Ready.</pre>
</div>

<script>
    const logEl = document.getElementById("log");
    let lastTask = null;

    function log(title, payload) {
        const stamp = new Date().toLocaleTimeString();
        const content = typeof payload === "string" ? payload : JSON.stringify(payload, null, 2);
        logEl.textContent = `[${stamp}] ${title}\n${content}\n\n` + logEl.textContent;
    }

    async function request(url, options = {}) {
        const response = await fetch(url, options);
        const contentType = response.headers.get("content-type") || "";
        if (contentType.includes("application/json")) {
            const body = await response.json();
            log(`${options.method || "GET"} ${url}`, body);
            if (!response.ok || body.code !== 0) {
                throw new Error(body.message || `Request failed: ${response.status}`);
            }
            return body.data;
        }
        return response;
    }

    function splitCsv(value) {
        return value.split(",").map(item => item.trim()).filter(Boolean);
    }

    document.getElementById("skill-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const payload = new FormData(form);
        try {
            await request("/api/v1/skills/upload", { method: "POST", body: payload });
        } catch (error) {
            log("技能包上传失败", error.message);
        }
    });

    document.getElementById("static-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const payload = new FormData(form);
        try {
            const result = await request("/api/v1/static-packages/upload", { method: "POST", body: payload });
            if (result?.id) {
                document.querySelector('#binding-form input[name="staticPackages"]').value = String(result.id);
            }
        } catch (error) {
            log("static package 上传失败", error.message);
        }
    });

    document.getElementById("expert-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(event.currentTarget).entries());
        try {
            await request("/api/v1/experts", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });
        } catch (error) {
            log("创建专家失败", error.message);
        }
    });

    document.getElementById("binding-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        const expertId = form.get("expertId");
        const whitelist = String(form.get("toolWhitelist") || "")
            .split(/\r?\n/)
            .map(item => item.trim())
            .filter(Boolean);
        const payload = {
            skills: splitCsv(String(form.get("skills") || "")),
            staticPackages: splitCsv(String(form.get("staticPackages") || "")),
            mcps: form.get("bindingName") && form.get("mcpUrl") ? [{
                bindingName: form.get("bindingName"),
                mcpUrl: form.get("mcpUrl"),
                toolWhitelist: whitelist
            }] : []
        };
        try {
            await request(`/api/v1/experts/${expertId}/bindings`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
        } catch (error) {
            log("更新绑定失败", error.message);
        }
    });

    document.getElementById("release-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const expertId = new FormData(event.currentTarget).get("expertId");
        try {
            lastTask = await request(`/api/v1/experts/${expertId}/release-tasks`, { method: "POST" });
            log("发布任务已创建", lastTask);
        } catch (error) {
            log("创建发布任务失败", error.message);
        }
    });

    document.getElementById("poll-task").addEventListener("click", async () => {
        const expertId = new FormData(document.getElementById("release-form")).get("expertId");
        if (!lastTask?.taskId) {
            log("轮询失败", "请先创建发布任务。");
            return;
        }
        try {
            const task = await request(`/api/v1/experts/${expertId}/release-tasks/${lastTask.taskId}`);
            lastTask = task;
            log("任务状态", task);
        } catch (error) {
            log("轮询任务失败", error.message);
        }
    });

    document.getElementById("query-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const expertId = new FormData(event.currentTarget).get("expertId");
        try {
            await request(`/api/v1/experts/${expertId}/config`);
        } catch (error) {
            log("查询配置失败", error.message);
        }
    });

    document.getElementById("download-package").addEventListener("click", () => {
        const expertId = new FormData(document.getElementById("query-form")).get("expertId");
        window.open(`/api/v1/experts/${expertId}/package/download`, "_blank");
    });
</script>
</body>
</html>
