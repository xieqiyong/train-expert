<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新建数字专家</title>
    <style>
        :root {
            --bg: #f5f2ea;
            --paper: rgba(255, 255, 255, 0.88);
            --paper-strong: #ffffff;
            --ink: #18212b;
            --muted: #677281;
            --line: rgba(24, 33, 43, 0.12);
            --accent: #2563eb;
            --accent-strong: #1d4ed8;
            --soft: #eef4ff;
            --danger: #c2410c;
            --shadow: 0 28px 70px rgba(24, 33, 43, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at top left, rgba(37, 99, 235, 0.15), transparent 26rem),
                radial-gradient(circle at bottom right, rgba(14, 116, 144, 0.14), transparent 24rem),
                linear-gradient(180deg, #fbfaf6 0%, var(--bg) 100%);
        }

        .page {
            width: min(1080px, calc(100% - 32px));
            margin: 0 auto;
            padding: 36px 0 56px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .topbar a {
            color: var(--accent-strong);
            text-decoration: none;
            font-weight: 600;
        }

        .layout {
            display: grid;
            gap: 22px;
            grid-template-columns: minmax(0, 1.1fr) minmax(300px, 0.72fr);
            align-items: start;
        }

        .panel {
            border: 1px solid var(--line);
            border-radius: 28px;
            background: var(--paper);
            box-shadow: var(--shadow);
            backdrop-filter: blur(14px);
        }

        .panel-body {
            padding: 28px;
        }

        h1 {
            margin: 0;
            font-size: 32px;
            line-height: 1.1;
        }

        .subhead {
            margin: 14px 0 0;
            color: var(--muted);
            line-height: 1.7;
        }

        .field {
            margin-top: 20px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid rgba(24, 33, 43, 0.14);
            border-radius: 14px;
            background: var(--paper-strong);
            color: var(--ink);
            font: inherit;
            padding: 13px 14px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: rgba(37, 99, 235, 0.55);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .counter {
            margin-top: 6px;
            text-align: right;
            color: var(--muted);
            font-size: 12px;
        }

        .hint {
            margin-top: 8px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
        }

        .toggle-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 18px;
        }

        .toggle {
            border: 0;
            background: none;
            color: var(--accent);
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            padding: 0;
        }

        .advanced {
            margin-top: 16px;
            border-radius: 20px;
            background: linear-gradient(180deg, rgba(238, 244, 255, 0.96), rgba(248, 250, 255, 0.96));
            border: 1px solid rgba(37, 99, 235, 0.08);
            padding: 22px;
        }

        .advanced[hidden] {
            display: none;
        }

        .section-title {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
        }

        .mcp-list {
            display: grid;
            gap: 16px;
            margin-top: 16px;
        }

        .mcp-card {
            border: 1px solid rgba(24, 33, 43, 0.1);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.82);
            padding: 16px;
        }

        .mcp-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .mcp-head strong {
            font-size: 14px;
        }

        .ghost-btn,
        .danger-btn,
        .primary-btn,
        .secondary-btn {
            border: 0;
            border-radius: 999px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.18s ease, opacity 0.18s ease;
        }

        .ghost-btn:hover,
        .danger-btn:hover,
        .primary-btn:hover,
        .secondary-btn:hover {
            transform: translateY(-1px);
        }

        .ghost-btn {
            background: rgba(37, 99, 235, 0.08);
            color: var(--accent-strong);
            padding: 10px 14px;
        }

        .danger-btn {
            background: rgba(194, 65, 12, 0.1);
            color: var(--danger);
            padding: 8px 12px;
        }

        .primary-btn,
        .secondary-btn {
            padding: 12px 18px;
            color: #fff;
        }

        .primary-btn {
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        }

        .secondary-btn {
            background: linear-gradient(135deg, #0f766e, #115e59);
        }

        .actions {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: flex-end;
            margin-top: 28px;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 16px;
            color: var(--muted);
            font-size: 14px;
        }

        .checkbox-row input {
            width: 18px;
            height: 18px;
            margin: 0;
        }

        .status-card {
            position: sticky;
            top: 24px;
        }

        .status-grid {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            margin-top: 18px;
        }

        .status-item {
            padding: 14px;
            border-radius: 16px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.7);
        }

        .status-item span {
            display: block;
            color: var(--muted);
            font-size: 12px;
        }

        .status-item strong {
            display: block;
            margin-top: 8px;
            font-size: 15px;
            overflow-wrap: anywhere;
        }

        .result,
        .console {
            margin-top: 18px;
            padding: 18px;
            border-radius: 18px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .result {
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid var(--line);
            min-height: 180px;
        }

        .console {
            background: #111a24;
            color: #d9f7ff;
            min-height: 240px;
            font-family: "IBM Plex Mono", Consolas, monospace;
            font-size: 13px;
            line-height: 1.65;
        }

        .link-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
        }

        .link-row a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 0 16px;
            border-radius: 999px;
            background: rgba(24, 33, 43, 0.08);
            color: var(--ink);
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 920px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .status-card {
                position: static;
            }
        }
    </style>
</head>
<body>
<div class="page">
    <div class="topbar">
        <div></div>
        <a href="/debug.html">打开调试页</a>
    </div>

    <div class="layout">
        <section class="panel">
            <div class="panel-body">
                <h1>新建数字专家</h1>
                <p class="subhead">正向入口会一次完成建专家、上传技能包、绑定 MCP，并可直接触发发布。技能名称和描述以 zip 内 `SKILL.md` 为准。</p>

                <form id="manual-create-form">
                    <div class="field">
                        <label for="name">名称</label>
                        <input id="name" name="name" maxlength="128" placeholder="请输入数字专家名称" required>
                    </div>

                    <div class="field">
                        <label for="description">描述</label>
                        <textarea id="description" name="description" maxlength="2000" placeholder="请输入数字专家描述"></textarea>
                        <div class="counter"><span id="description-count">0</span>/2000</div>
                    </div>

                    <div class="field">
                        <label for="prompt">提示词（Prompt）</label>
                        <textarea id="prompt" name="prompt" maxlength="2000" placeholder="请输入提示词"></textarea>
                        <div class="counter"><span id="prompt-count">0</span>/2000</div>
                    </div>

                    <div class="field">
                        <label for="skill-files">技能文件</label>
                        <input id="skill-files" name="skillFiles" type="file" accept=".zip" multiple required>
                        <div class="hint">支持一个或多个 `skills.zip`。系统会自动读取 zip 中的 `SKILL.md`，并写入 `skill_package`。</div>
                    </div>

                    <div class="toggle-row">
                        <button class="toggle" id="toggle-advanced" type="button">展开高级配置</button>
                    </div>

                    <section class="advanced" id="advanced-panel" hidden>
                        <h2 class="section-title">MCP 配置</h2>
                        <div class="hint">每个 MCP 由地址和工具白名单组成。白名单留空表示允许全部工具，支持添加多个 MCP。</div>
                        <div class="mcp-list" id="mcp-list"></div>
                        <div class="link-row">
                            <button class="ghost-btn" id="add-mcp" type="button">新增 MCP</button>
                        </div>
                        <label class="checkbox-row">
                            <input id="auto-release" name="autoRelease" type="checkbox" checked>
                            创建完成后自动发布专家包
                        </label>
                    </section>

                    <div class="actions">
                        <button class="secondary-btn" id="reset-form" type="button">重置</button>
                        <button class="primary-btn" id="submit-btn" type="submit">确定</button>
                    </div>
                </form>
            </div>
        </section>

        <aside class="status-card panel">
            <div class="panel-body">
                <h2 class="section-title">当前结果</h2>
                <div class="status-grid">
                    <div class="status-item">
                        <span>专家 ID</span>
                        <strong id="expert-id">-</strong>
                    </div>
                    <div class="status-item">
                        <span>发布任务</span>
                        <strong id="release-task-id">-</strong>
                    </div>
                    <div class="status-item">
                        <span>专家状态</span>
                        <strong id="expert-status">-</strong>
                    </div>
                    <div class="status-item">
                        <span>技能数量</span>
                        <strong id="skill-count">0</strong>
                    </div>
                </div>

                <div class="result" id="result-box">提交后会在这里显示创建结果。</div>

                <div class="link-row">
                    <a href="/debug.html">继续联调</a>
                </div>

                <div class="console" id="console">控制台已就绪。</div>
            </div>
        </aside>
    </div>
</div>

<template id="mcp-template">
    <div class="mcp-card">
        <div class="mcp-head">
            <strong class="mcp-title">MCP 1</strong>
            <button class="danger-btn remove-mcp" type="button">删除</button>
        </div>
        <div class="field">
            <label>绑定名称</label>
            <input class="mcp-binding-name" maxlength="128" placeholder="例如：default_mcp">
        </div>
        <div class="field">
            <label>MCP 地址</label>
            <input class="mcp-url" maxlength="512" placeholder="例如：http://127.0.0.1:3000/mcp">
        </div>
        <div class="field">
            <label>工具白名单</label>
            <textarea class="mcp-whitelist" placeholder="每行一个工具名称，留空表示全部工具"></textarea>
        </div>
    </div>
</template>

<script>
    const form = document.getElementById("manual-create-form");
    const advancedPanel = document.getElementById("advanced-panel");
    const toggleAdvancedBtn = document.getElementById("toggle-advanced");
    const addMcpBtn = document.getElementById("add-mcp");
    const resetFormBtn = document.getElementById("reset-form");
    const submitBtn = document.getElementById("submit-btn");
    const mcpList = document.getElementById("mcp-list");
    const mcpTemplate = document.getElementById("mcp-template");
    const consoleEl = document.getElementById("console");
    const resultBox = document.getElementById("result-box");
    const expertIdEl = document.getElementById("expert-id");
    const releaseTaskIdEl = document.getElementById("release-task-id");
    const expertStatusEl = document.getElementById("expert-status");
    const skillCountEl = document.getElementById("skill-count");

    function appendLog(title, payload) {
        const stamp = new Date().toLocaleTimeString();
        const text = typeof payload === "string" ? payload : JSON.stringify(payload, null, 2);
        consoleEl.textContent = `[${stamp}] ${title}\n${text}\n\n${consoleEl.textContent}`;
    }

    function bindCounter(inputId, counterId) {
        const input = document.getElementById(inputId);
        const counter = document.getElementById(counterId);
        const sync = () => { counter.textContent = String(input.value.length); };
        input.addEventListener("input", sync);
        sync();
        return sync;
    }

    function updateAdvancedToggle() {
        toggleAdvancedBtn.textContent = advancedPanel.hidden ? "展开高级配置" : "收起高级配置";
    }

    function renderMcpTitles() {
        [...mcpList.querySelectorAll(".mcp-card")].forEach((card, index) => {
            card.querySelector(".mcp-title").textContent = `MCP ${index + 1}`;
        });
    }

    function addMcpCard(mcp = {}) {
        const fragment = mcpTemplate.content.cloneNode(true);
        const card = fragment.querySelector(".mcp-card");
        card.querySelector(".mcp-binding-name").value = mcp.bindingName || "";
        card.querySelector(".mcp-url").value = mcp.mcpUrl || "";
        card.querySelector(".mcp-whitelist").value = Array.isArray(mcp.toolWhitelist) ? mcp.toolWhitelist.join("\n") : "";
        card.querySelector(".remove-mcp").addEventListener("click", () => {
            card.remove();
            renderMcpTitles();
        });
        mcpList.appendChild(fragment);
        renderMcpTitles();
    }

    function buildMcps() {
        return [...mcpList.querySelectorAll(".mcp-card")].map((card) => {
            const bindingName = card.querySelector(".mcp-binding-name").value.trim();
            const mcpUrl = card.querySelector(".mcp-url").value.trim();
            const toolWhitelist = card.querySelector(".mcp-whitelist").value
                .split(/\r?\n/)
                .map((item) => item.trim())
                .filter(Boolean);
            if (!bindingName && !mcpUrl && toolWhitelist.length === 0) {
                return null;
            }
            if (!bindingName || !mcpUrl) {
                throw new Error("MCP 配置填写不完整，绑定名称和地址必须同时填写");
            }
            return { bindingName, mcpUrl, toolWhitelist };
        }).filter(Boolean);
    }

    async function submitManualCreate(event) {
        event.preventDefault();
        submitBtn.disabled = true;
        submitBtn.textContent = "提交中...";
        try {
            const skillFiles = document.getElementById("skill-files").files;
            if (!skillFiles.length) {
                throw new Error("请至少上传一个技能 zip 文件");
            }
            const mcps = buildMcps();
            const formData = new FormData();
            formData.append("name", document.getElementById("name").value.trim());
            formData.append("description", document.getElementById("description").value.trim());
            formData.append("prompt", document.getElementById("prompt").value.trim());
            formData.append("mcpsJson", JSON.stringify(mcps));
            formData.append("autoRelease", document.getElementById("auto-release").checked ? "true" : "false");
            [...skillFiles].forEach((file) => formData.append("skillFiles", file));

            const response = await fetch("/api/v1/experts/manual/create", {
                method: "POST",
                body: formData
            });
            const body = await response.json();
            appendLog("POST /api/v1/experts/manual/create", body);
            if (!response.ok || body.code !== 0) {
                throw new Error(body.message || `HTTP ${response.status}`);
            }
            renderResult(body.data);
        } catch (error) {
            appendLog("创建数字专家失败", error.message);
            resultBox.textContent = error.message;
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "确定";
        }
    }

    function renderResult(data) {
        expertIdEl.textContent = data?.expert?.id ?? "-";
        expertStatusEl.textContent = data?.expert?.status ?? "-";
        releaseTaskIdEl.textContent = data?.releaseTask?.taskId ?? "-";
        skillCountEl.textContent = String(Array.isArray(data?.skills) ? data.skills.length : 0);
        resultBox.textContent = JSON.stringify(data, null, 2);
    }

    toggleAdvancedBtn.addEventListener("click", () => {
        advancedPanel.hidden = !advancedPanel.hidden;
        updateAdvancedToggle();
    });

    addMcpBtn.addEventListener("click", () => addMcpCard());

    resetFormBtn.addEventListener("click", () => {
        form.reset();
        mcpList.innerHTML = "";
        addMcpCard();
        syncDescriptionCount();
        syncPromptCount();
        advancedPanel.hidden = true;
        updateAdvancedToggle();
        resultBox.textContent = "提交后会在这里显示创建结果。";
        expertIdEl.textContent = "-";
        expertStatusEl.textContent = "-";
        releaseTaskIdEl.textContent = "-";
        skillCountEl.textContent = "0";
    });

    form.addEventListener("submit", submitManualCreate);

    const syncDescriptionCount = bindCounter("description", "description-count");
    const syncPromptCount = bindCounter("prompt", "prompt-count");
    addMcpCard();
    updateAdvancedToggle();
</script>
</body>
</html>
